# Logstash Pipeline Configuration for PMS API Logs

input {
  # Receive logs from Node.js app via TCP
  tcp {
    port => 5000
    codec => json_lines
    tags => ["pms-api"]
  }

  # Alternative: Receive logs via HTTP
  http {
    port => 5044
    codec => json
    tags => ["pms-api-http"]
  }
}

filter {
  # Parse timestamp if present
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Add request metadata
  if [req] {
    mutate {
      add_field => {
        "request_method" => "%{[req][method]}"
        "request_url" => "%{[req][url]}"
        "request_id" => "%{[req][id]}"
      }
    }
    
    # Extract endpoint path (remove query params)
    if [req][url] {
      grok {
        match => { "[req][url]" => "^(?<endpoint>[^?]+)" }
        tag_on_failure => ["_grok_endpoint_failure"]
      }
    }
  }

  # Add response metadata
  if [res] {
    mutate {
      add_field => {
        "response_status" => "%{[res][statusCode]}"
      }
    }
    
    # Categorize status codes
    if [res][statusCode] {
      ruby {
        code => "
          status = event.get('[res][statusCode]').to_i
          if status >= 200 && status < 300
            event.set('status_category', 'success')
          elsif status >= 300 && status < 400
            event.set('status_category', 'redirect')
          elsif status >= 400 && status < 500
            event.set('status_category', 'client_error')
          elsif status >= 500
            event.set('status_category', 'server_error')
          else
            event.set('status_category', 'unknown')
          end
        "
      }
    }
  }

  # Parse response time
  if [responseTime] {
    mutate {
      convert => { "responseTime" => "integer" }
      add_field => { "response_time_ms" => "%{responseTime}" }
    }
    
    # Categorize response time
    ruby {
      code => "
        rt = event.get('responseTime').to_i
        if rt < 100
          event.set('response_time_category', 'fast')
        elsif rt < 500
          event.set('response_time_category', 'normal')
        elsif rt < 1000
          event.set('response_time_category', 'slow')
        else
          event.set('response_time_category', 'very_slow')
        end
      "
    }
  }

  # Parse log level
  if [level] {
    mutate {
      add_field => { "log_level" => "%{level}" }
    }
    
    # Convert pino numeric levels to names
    ruby {
      code => "
        level = event.get('level')
        level_name = case level.to_i
          when 10 then 'trace'
          when 20 then 'debug'
          when 30 then 'info'
          when 40 then 'warn'
          when 50 then 'error'
          when 60 then 'fatal'
          else level.to_s
        end
        event.set('log_level_name', level_name)
      "
    }
  }

  # Extract user information if present
  if [userId] {
    mutate {
      add_field => { "user_id" => "%{userId}" }
    }
  }

  # Add service metadata
  mutate {
    add_field => {
      "service" => "pms-api"
      "environment" => "${NODE_ENV:production}"
    }
  }

  # Handle error logs
  if [err] or [error] {
    mutate {
      add_tag => ["error"]
    }
    
    if [err][message] {
      mutate {
        add_field => { "error_message" => "%{[err][message]}" }
      }
    }
    
    if [err][stack] {
      mutate {
        add_field => { "error_stack" => "%{[err][stack]}" }
      }
    }
  }

  # GeoIP lookup for client IP (if available)
  if [req][remoteAddress] and [req][remoteAddress] !~ /^(::1|127\.0\.0\.1|::ffff:127\.0\.0\.1)$/ {
    geoip {
      source => "[req][remoteAddress]"
      target => "geoip"
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }

  # Remove unnecessary fields to reduce storage
  mutate {
    remove_field => ["@version", "host", "port"]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "pms-logs-%{+YYYY.MM.dd}"
    user => "${ELASTIC_USER:elastic}"
    password => "${ELASTIC_PASSWORD:changeme}"
  }

  # Debug output (remove in production)
  # stdout {
  #   codec => rubydebug
  # }
}
